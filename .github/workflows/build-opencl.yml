# Unsigned Windows OpenCL zip artifacts for this fork (learning/ops; not an
# official Ollama release). Leaves .github/workflows/release.yaml untouched.
#
# How to run:
#   GitHub → Actions → "Windows OpenCL (unsigned zip)" → Run workflow
#   Pick both / arm64 / amd64. No secrets are required.
#
# Also runs on push to a ci-opencl* branch, or when this workflow / the
# OpenCL build script changes on main.
#
# Artifacts are unsigned: no Authenticode, no MSIX, no OllamaSetup.exe, and
# no `environment: release` secrets. Do not treat these zips as a production
# installer.
#
#   ollama-windows-arm64-opencl.zip
#     Snapdragon / Adreno. Native build on windows-11-arm with the
#     llvm-mingw aarch64-host package (same shape as a Dell on-device
#     build). Adreno source kernels ON; binary kernels OFF.
#     Do not x64→ARM64 cross-compile this zip: that produced a loadable
#     ggml-opencl.dll that still failed Adreno device enumeration.
#   ollama-windows-amd64-opencl.zip
#     Intel Iris Xe / generic OpenCL. Native MSVC + Ninja on windows-latest.
#     GGML_OPENCL_USE_ADRENO_KERNELS=OFF.
#
# Zip layout (both):
#   ollama.exe
#   lib/ollama/**            (CPU llama-server + ggml)
#   lib/ollama/opencl/**     (ggml-opencl.dll + mingw runtime DLLs)
#   Start-OpenCL.ps1 / Start-CPU.ps1
#   README_OPENCL.txt
# OpenCL.dll is not bundled; Adreno uses C:\Windows\System32\OpenCL.dll.
# ggml-opencl.dll must stay under opencl/; ollama serve sets
# GGML_BACKEND_PATH to that file when OLLAMA_LLM_LIBRARY=opencl.
#
# Runtime: OLLAMA_LLM_LIBRARY=opencl and OLLAMA_VULKAN=0.
# See docs/ci-opencl.md.

name: Windows OpenCL (unsigned zip)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which unsigned Windows OpenCL zip to build
        type: choice
        options:
          - both
          - arm64
          - amd64
        default: both
  pull_request:
    paths:
      - ".github/workflows/build-opencl.yml"
      - "scripts/build_windows_opencl.ps1"
      - "cmake/local.cmake"
      - "cmake/windows-arm64-llvm-mingw.cmake"
      - "llama/server/CMakeLists.txt"
      - "llama/server/CMakePresets.json"
      - "llm/opencl_windows.go"
      - "llm/opencl_windows_test.go"
      - "llm/rocm_windows.go"
      - "llm/llama_server.go"
      - "llm/llama_server_test.go"
      - "discover/runner.go"
      - "discover/runner_test.go"
      - "docs/ci-opencl.md"
  push:
    branches:
      - main
      - "ci-opencl*"
    paths:
      - ".github/workflows/build-opencl.yml"
      - "scripts/build_windows_opencl.ps1"
      - "cmake/local.cmake"
      - "cmake/windows-arm64-llvm-mingw.cmake"
      - "llama/server/CMakeLists.txt"
      - "llama/server/CMakePresets.json"
      - "llm/opencl_windows.go"
      - "llm/opencl_windows_test.go"
      - "llm/rocm_windows.go"
      - "llm/llama_server.go"
      - "llm/llama_server_test.go"
      - "discover/runner.go"
      - "discover/runner_test.go"
      - "docs/ci-opencl.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja

jobs:
  select:
    name: select-targets
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.set.outputs.archs }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event.inputs.target || 'both' }}"
          case "$target" in
            arm64) echo 'archs=["arm64"]' >> "$GITHUB_OUTPUT" ;;
            amd64) echo 'archs=["amd64"]' >> "$GITHUB_OUTPUT" ;;
            both)  echo 'archs=["arm64","amd64"]' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "unknown target: $target" >&2
              exit 1
              ;;
          esac

  windows-opencl:
    name: windows-${{ matrix.arch }}-opencl
    needs: select
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.select.outputs.archs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION

      - name: Install Ninja (pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $ninjaDir = Join-Path $env:RUNNER_TEMP "ninja"
          New-Item -ItemType Directory -Force -Path $ninjaDir | Out-Null
          # windows-11-arm cannot run the x64 ninja-win.zip.
          $ninjaZip = if ("${{ matrix.arch }}" -eq "arm64") { "ninja-winarm64.zip" } else { "ninja-win.zip" }
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/$ninjaZip" -OutFile "$env:RUNNER_TEMP\ninja.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ninja.zip" -DestinationPath $ninjaDir -Force
          if (!(Test-Path "$ninjaDir\ninja.exe")) {
            throw "ninja.exe missing after extract"
          }
          $ninjaDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install llvm-mingw aarch64 host (native ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          # Native aarch64-host package on windows-11-arm. Do not use the
          # x86_64-host cross package from release.yaml cpuArm64: that zip
          # loaded ggml-opencl.dll on Adreno but never enumerated the device.
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-aarch64.zip" -OutFile "${{ runner.temp }}\llvm-mingw-ucrt.zip"
          Expand-Archive -Path "${{ runner.temp }}\llvm-mingw-ucrt.zip" -DestinationPath "C:\Program Files\" -Force
          $installPath = (Resolve-Path -Path "C:\Program Files\llvm-mingw-*-ucrt-aarch64").Path
          if (!(Test-Path "$installPath\bin\aarch64-w64-mingw32-gcc.exe")) {
            throw "llvm-mingw aarch64 package is missing aarch64-w64-mingw32-gcc.exe"
          }
          "$installPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prove llama-server OpenCL backend-path wiring
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go test ./llm ./discover -count=1 -run "TestSetupLlamaServerCommandEnv|TestFindLlamaServerGPUBackendOpenCL|TestLookupRunnerLibDirsFindsOpenCL|TestSkipRequestedRunnerDir"

      - name: Build unsigned OpenCL zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/build_windows_opencl.ps1 -Arch ${{ matrix.arch }}

      - name: Verify zip layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $PWD "dist\ollama-windows-${{ matrix.arch }}-opencl.zip"
          if (!(Test-Path $zip)) {
            throw "missing $zip"
          }
          $inspect = Join-Path $env:RUNNER_TEMP "opencl-zip-${{ matrix.arch }}"
          if (Test-Path $inspect) { Remove-Item -Recurse -Force $inspect }
          Expand-Archive -Path $zip -DestinationPath $inspect -Force
          $required = @(
            "ollama.exe",
            "lib\ollama\llama-server.exe",
            "lib\ollama\opencl\ggml-opencl.dll",
            "Start-OpenCL.ps1",
            "Start-CPU.ps1"
          )
          foreach ($rel in $required) {
            $path = Join-Path $inspect $rel
            if (!(Test-Path $path)) {
              throw "zip is missing $rel"
            }
          }
          $flattened = Join-Path $inspect "lib\ollama\ggml-opencl.dll"
          if (Test-Path $flattened) {
            throw "zip must not place ggml-opencl.dll next to llama-server.exe; that auto-loads OpenCL and breaks OLLAMA_LLM_LIBRARY=cpu"
          }
          $icd = Join-Path $inspect "lib\ollama\opencl\OpenCL.dll"
          if (Test-Path $icd) {
            throw "zip must not bundle OpenCL.dll; Adreno uses the System32/host vendor loader"
          }
          $wantMachine = if ("${{ matrix.arch }}" -eq "arm64") { 0xAA64 } else { 0x8664 }
          $peFiles = Get-ChildItem -Path $inspect -Recurse -File | Where-Object { $_.Extension -in '.dll', '.exe' }
          foreach ($pe in $peFiles) {
            $bytes = [IO.File]::ReadAllBytes($pe.FullName)
            if ($bytes.Length -lt 64 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 2) -ne "MZ") {
              throw "$($pe.Name) is not a PE image"
            }
            $eLfanew = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $eLfanew + 4)
            if ($machine -ne $wantMachine) {
              throw "$($pe.FullName.Substring($inspect.Length).TrimStart('\','/')) has PE machine 0x$($machine.ToString('X')) (want 0x$($wantMachine.ToString('X')))"
            }
          }
          Write-Host "Zip contents (no OpenCL.dll; PE machine 0x$($wantMachine.ToString('X'))):"
          Get-ChildItem -Path $inspect -Recurse -File | ForEach-Object {
            Write-Host ("  {0}" -f $_.FullName.Substring($inspect.Length).TrimStart('\', '/'))
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ollama-windows-${{ matrix.arch }}-opencl
          path: dist/ollama-windows-${{ matrix.arch }}-opencl.zip
          if-no-files-found: error
